name: Deploy to Dokploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Trigger production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call Dokploy deployment webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_WEBHOOK_URL is not configured." >&2
            exit 1
          fi

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --request POST \
            --retry 3 \
            --retry-all-errors \
            "$DOKPLOY_WEBHOOK_URL"