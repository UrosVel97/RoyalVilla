name: Deploy to Dokploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Trigger production deployment
    runs-on: ubuntu-latest
    environment: Dokploy
    timeout-minutes: 5
    steps:
      - name: Call Dokploy deployment webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_WEBHOOK_URL is not configured." >&2
            exit 1
          fi

          payload="$GITHUB_EVENT_PATH"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            payload="$RUNNER_TEMP/dokploy-payload.json"
            jq --null-input \
              --arg ref "refs/heads/$GITHUB_REF_NAME" \
              --arg after "$GITHUB_SHA" \
              '{
                ref: $ref,
                after: $after,
                head_commit: { message: "Manual deployment" },
                commits: []
              }' > "$payload"
          fi

          response="$RUNNER_TEMP/dokploy-response.json"
          status=$(curl \
            --fail-with-body \
            --show-error \
            --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --data-binary "@$payload" \
            --output "$response" \
            --write-out "%{http_code}" \
            --retry 3 \
            --retry-all-errors \
            "$DOKPLOY_WEBHOOK_URL")

          cat "$response"

          if [ "$status" != "200" ] || ! jq --exit-status \
            '.message == "Compose deployed successfully"' "$response" >/dev/null; then
            echo "Dokploy rejected the deployment (HTTP $status)." >&2
            exit 1
          fi